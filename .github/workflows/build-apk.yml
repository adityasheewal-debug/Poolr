name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - poolr-android-source.tar.gz
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: tar -xzf poolr-android-source.tar.gz

      - name: Build debug APK
        run: gradle -p android-wrapper assembleDebug --no-daemon

      - name: Name APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk POOLR-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POOLR-Android-APK
          path: POOLR-debug.apk
          if-no-files-found: error
